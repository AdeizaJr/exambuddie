<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <!-- Top highlight -->
  <rect width="180" height="90" rx="40" fill="url(#shine)"/>

  <!-- Bold E — vertical spine -->
  <rect x="34" y="34" width="22" height="112" rx="5" fill="white"/>
  <!-- Top bar -->
  <rect x="34" y="34" width="102" height="28" rx="5" fill="white"/>
  <!-- Middle bar -->
  <rect x="34" y="76" width="73" height="24" rx="5" fill="white"/>
  <!-- Bottom bar -->
  <rect x="34" y="118" width="102" height="28" rx="5" fill="white"/>

  <!-- Gold 4-point star sparkle — bottom right -->
  <path d="M146,124 L150,138 L165,142 L150,146 L146,160 L142,146 L127,142 L142,138 Z" fill="#FDE68A" filter="url(#glow)"/>
</svg>
