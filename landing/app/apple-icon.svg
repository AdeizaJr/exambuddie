<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <!-- Top highlight -->
  <rect width="180" height="90" rx="40" fill="url(#shine)"/>

  <!-- Open book — left page -->
  <path d="M90,45 L28,62 L28,129 L90,124 Z" fill="white"/>

  <!-- Open book — right page -->
  <path d="M90,45 L152,62 L152,129 L90,124 Z" fill="white" opacity="0.82"/>

  <!-- Spine -->
  <line x1="90" y1="45" x2="90" y2="124" stroke="#818CF8" stroke-width="4"/>

  <!-- Page lines left -->
  <line x1="42"  y1="81"  x2="76"  y2="78"  stroke="rgba(147,197,253,0.65)" stroke-width="5" stroke-linecap="round"/>
  <line x1="42"  y1="96"  x2="76"  y2="93"  stroke="rgba(147,197,253,0.65)" stroke-width="5" stroke-linecap="round"/>
  <line x1="42"  y1="111" x2="65"  y2="108" stroke="rgba(147,197,253,0.65)" stroke-width="5" stroke-linecap="round"/>

  <!-- Page lines right -->
  <line x1="104" y1="78"  x2="138" y2="81"  stroke="rgba(147,197,253,0.45)" stroke-width="5" stroke-linecap="round"/>
  <line x1="104" y1="93"  x2="138" y2="96"  stroke="rgba(147,197,253,0.45)" stroke-width="5" stroke-linecap="round"/>
  <line x1="104" y1="108" x2="127" y2="111" stroke="rgba(147,197,253,0.45)" stroke-width="5" stroke-linecap="round"/>

  <!-- 4-point gold star (AI sparkle) — top right -->
  <path d="M152,20 L156,32 L168,36 L156,40 L152,52 L148,40 L136,36 L148,32 Z" fill="#FDE68A" filter="url(#glow)"/>
</svg>
