<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Open book — left page (angled perspective) -->
  <path d="M16,8 L5,11 L5,23 L16,22 Z" fill="white"/>

  <!-- Open book — right page -->
  <path d="M16,8 L27,11 L27,23 L16,22 Z" fill="white" opacity="0.82"/>

  <!-- Spine -->
  <line x1="16" y1="8" x2="16" y2="22" stroke="#818CF8" stroke-width="0.75"/>

  <!-- Page lines left -->
  <line x1="7.5" y1="14.5" x2="13.5" y2="14" stroke="rgba(147,197,253,0.65)" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="7.5" y1="17"   x2="13.5" y2="16.5" stroke="rgba(147,197,253,0.65)" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="7.5" y1="19.5" x2="11.5" y2="19.2" stroke="rgba(147,197,253,0.65)" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Page lines right -->
  <line x1="18.5" y1="14"   x2="24.5" y2="14.5" stroke="rgba(147,197,253,0.45)" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="18.5" y1="16.5" x2="24.5" y2="17"   stroke="rgba(147,197,253,0.45)" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="18.5" y1="19.2" x2="22.5" y2="19.5" stroke="rgba(147,197,253,0.45)" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 4-point gold star (AI sparkle) — top right -->
  <path d="M27,3.5 L27.7,5.8 L30,6.5 L27.7,7.2 L27,9.5 L26.3,7.2 L24,6.5 L26.3,5.8 Z" fill="#FDE68A"/>
</svg>
